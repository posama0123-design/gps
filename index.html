<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Tracker - Pro</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100%; }
        /* モード選択画面のスタイル */
        #setup-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 2000;
            display: flex; justify-content: center; align-items: center; color: white;
            flex-direction: column; text-align: center;
        }
        .btn {
            padding: 15px 30px; margin: 10px; font-size: 1.2rem; cursor: pointer;
            border: none; border-radius: 10px; transition: 0.3s;
        }
        .btn-send { background: #007bff; color: white; }
        .btn-watch { background: #28a745; color: white; }
        .info-panel {
            position: fixed; top: 10px; left: 10px; z-index: 1000;
            background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div id="setup-screen">
    <h1>GPS共有アプリ</h1>
    <p>モードを選択してください</p>
    <button class="btn btn-send" onclick="startApp('send')">場所を共有する（監視される側）</button>
    <button class="btn btn-watch" onclick="startApp('watch')">場所を見る（監視側）</button>
</div>

<div class="info-panel">
    <div id="status">モードを選択してください</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBaMe4Cz_3W75F5NCtioAguONgukg3-k0g",
        authDomain: "my-call-14d70.firebaseapp.com",
        databaseURL: "https://my-call-14d70-default-rtdb.firebaseio.com",
        projectId: "my-call-14d70",
        storageBucket: "my-call-14d70.firebasestorage.app",
        messagingSenderId: "769393584037",
        appId: "1:769393584037:web:279aa04477f2649230ea4c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const myUserId = "User_" + Math.floor(Math.random() * 9000 + 1000);

    const map = L.map('map').setView([35.6812, 139.7671], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const markers = {};
    const paths = {}; // 各ユーザーの軌跡（青い線）を保存する

    // グローバルにアクセスできるようにwindowに登録
    window.startApp = function(mode) {
        document.getElementById('setup-screen').style.display = 'none';
        
        if (mode === 'send') {
            document.getElementById('status').textContent = "自分の場所を送信中...";
            startTracking();
        } else {
            document.getElementById('status').textContent = "みんなの場所を監視中...";
        }
        listenToUpdates();
    };

    // 位置情報を追跡してFirebaseに送る
    function startTracking() {
        if (!navigator.geolocation) {
            alert("GPSが使えません");
            return;
        }

        const myLocationRef = ref(db, 'locations/' + myUserId);
        onDisconnect(myLocationRef).remove();

        navigator.geolocation.watchPosition((position) => {
            const { latitude, longitude } = position.coords;
            set(myLocationRef, {
                lat: latitude,
                lng: longitude,
                timestamp: Date.now()
            });
        }, (err) => {
            console.error(err);
            alert("位置情報の許可が必要です。設定を確認してください。");
        }, { enableHighAccuracy: true });
    }

    // Firebaseのデータを地図に反映（軌跡付き）
    function listenToUpdates() {
        onValue(ref(db, 'locations'), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            Object.keys(data).forEach((id) => {
                const pos = [data[id].lat, data[id].lng];

                // 1. マーカー（ピン）の更新
                if (!markers[id]) {
                    markers[id] = L.marker(pos).addTo(map).bindPopup(id);
                    // 2. 軌跡用の線（Polyline）を初期化
                    paths[id] = L.polyline([pos], { color: 'blue', weight: 4, opacity: 0.6 }).addTo(map);
                } else {
                    markers[id].setLatLng(pos);
                    // 3. 線に新しい点を追加
                    paths[id].addLatLng(pos);
                }
            });
        });
    }
</script>
</body>
</html>
